<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#6b3416" />
    <meta http-equiv="cache-control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="pragma" content="no-cache" />
    <meta http-equiv="expires" content="0" />
    <title>くるひもタイムズ ゲームボーイ風カウンター</title>
    <link rel="stylesheet" href="./styles.css?v=one-minute-refresh-1" />
  </head>
  <body>
    <main class="gameboy-frame" aria-label="iPhone SE 横向き専用のくるひもタイムズ訪問回数カウンター">
      <canvas id="pixel-screen" width="334" height="188" aria-label="くるひもタイムズ記事ビューカウンター"></canvas>
      <p id="counter-note" class="sr-status" aria-live="polite">カウンターを読み込み中...</p>
    </main>

    <script>
      (() => {
        const canvas = document.getElementById('pixel-screen');
        const note = document.getElementById('counter-note');
        const ctx = canvas.getContext('2d');
        const W = 334;
        const H = 188;
        const API_URLS = ['https://kuruhimo.com/api/article-counter', 'https://kuruhitimes.pages.dev/api/article-counter'];
        const DATA_URLS = ['https://kuruhimo.com/data.json', 'https://kuruhitimes.pages.dev/data.json', 'https://raw.githubusercontent.com/Nacchanman/kuruhitimes/main/data.json'];
        const FALLBACK_IDS = ['idea-5', 'idea-4', 'idea-3', 'idea-2', 'idea-1'];
        const REFRESH_MS = 60 * 1000;
        const C = {
          black: '#1b1008', brown: '#542713', dark: '#8f3515', orange: '#d85a22',
          mid: '#ef8b3b', light: '#ffba5c', paper: '#ffe0a0', pale: '#fff0bf',
          cream: '#fff7d1', critter: '#cc805d', gray: '#8e8e8e'
        };
        const D = {
          '0':['111','101','101','101','101','101','111'], '1':['010','110','010','010','010','010','111'],
          '2':['111','001','001','111','100','100','111'], '3':['111','001','001','111','001','001','111'],
          '4':['101','101','101','111','001','001','001'], '5':['111','100','100','111','001','001','111'],
          '6':['111','100','100','111','101','101','111'], '7':['111','001','001','010','010','010','010'],
          '8':['111','101','101','111','101','101','111'], '9':['111','101','101','111','001','001','111'],
          '-':['000','000','000','111','000','000','000']
        };
        let total = 0;
        let articleCount = '--';
        let source = 'LOADING';
        let updated = '--:--';
        let blink = true;
        let cachedIds = [];
        let animFrame = 0;
        ctx.imageSmoothingEnabled = false;

        function r(x, y, w, h, color) {
          ctx.fillStyle = color;
          ctx.fillRect(Math.round(x), Math.round(y), Math.round(w), Math.round(h));
        }
        function t(str, x, y, size, color, align = 'left', font = 'monospace') {
          ctx.fillStyle = color;
          ctx.textAlign = align;
          ctx.textBaseline = 'top';
          ctx.font = `${size}px ${font}`;
          ctx.fillText(str, Math.round(x), Math.round(y));
        }
        function digit(ch, x, y, s, color) {
          (D[ch] || D['-']).forEach((row, yy) => [...row].forEach((v, xx) => {
            if (v === '1') r(x + xx * s, y + yy * s, s, s, color);
          }));
        }
        function number(n, x, y, s, color) {
          String(Math.max(0, Number(n) || 0)).padStart(6, '0').split('').forEach((ch, i) => {
            digit(ch, x + i * s * 4, y, s, color);
          });
        }
        function bird(x, y) {
          r(x, y + 2, 4, 2, C.brown);
          r(x + 4, y, 3, 2, C.brown);
          r(x + 7, y + 2, 4, 2, C.brown);
        }
        function drawClaudeCritter(x, y, frame = 0) {
          const hop = frame % 2 === 0 ? 0 : -1;
          const legShift = frame % 4 < 2 ? 0 : 1;
          const body = C.critter;

          r(x + 2, y + 1 + hop, 10, 1, body);
          r(x + 1, y + 2 + hop, 12, 1, body);
          r(x, y + 3 + hop, 14, 3, body);
          r(x + 1, y + 6 + hop, 12, 2, body);
          r(x + 3, y + 3 + hop, 1, 1, C.black);
          r(x + 10, y + 3 + hop, 1, 1, C.black);

          // four legs: same color as body
          r(x + 3, y + 8 + hop + legShift, 1, 3, body);
          r(x + 6, y + 8 + hop, 1, 3, body);
          r(x + 9, y + 8 + hop + legShift, 1, 3, body);
          r(x + 11, y + 8 + hop, 1, 3, body);

          // tiny tail detail
          r(x + 12, y + 1 + hop, 2, 1, C.gray);
          r(x + 13, y + hop, 1, 2, C.gray);
        }
        function pointOnPath(points, frame) {
          const loop = 96;
          const f = frame % loop;
          const segmentCount = points.length - 1;
          const segmentLength = loop / segmentCount;
          const index = Math.min(segmentCount - 1, Math.floor(f / segmentLength));
          const local = (f - index * segmentLength) / segmentLength;
          const a = points[index];
          const b = points[index + 1];
          return {
            x: Math.round(a[0] + (b[0] - a[0]) * local),
            y: Math.round(a[1] + (b[1] - a[1]) * local)
          };
        }
        function drawRoamingCritter() {
          const path = [[18,64],[69,141],[143,158],[254,148],[305,108],[284,58],[176,37],[62,54],[18,64]];
          const p = pointOnPath(path, animFrame);
          drawClaudeCritter(p.x, p.y, animFrame);
        }
        function draw() {
          ctx.clearRect(0, 0, W, H);
          r(0, 0, W, H, C.pale);

          r(0, 0, W, 34, C.mid);
          r(0, 34, W, 5, C.light);
          r(132, 0, 70, 6, C.light);
          r(118, 6, 98, 6, '#ffa84a');
          r(104, 12, 126, 7, C.orange);
          r(95, 19, 144, 8, C.dark);
          r(0, 31, W, 2, C.brown);
          bird(88, 10);
          bird(250, 8);

          for (let y = 40; y < H; y += 9) r(0, y, W, 1, 'rgba(84,39,19,0.10)');
          for (let x = 0; x < W; x += 9) r(x, 40, 1, H - 40, 'rgba(84,39,19,0.06)');

          r(0, 41, W, 2, C.brown);
          r(0, 60, W, 2, C.brown);
          r(6, 46, 36, 10, C.black);
          t('VOL013', 9, 48, 6, C.pale);
          t('KURUHIMO TIMES', 55, 47, 8, C.brown);
          t('TOTAL VIEWS', 199, 47, 8, C.brown);
          t(updated, 292, 47, 8, C.brown);

          r(13, 69, 308, 78, C.black);
          r(18, 74, 298, 68, C.paper);
          r(22, 79, 290, 58, C.cream);
          r(25, 83, 284, 2, C.orange);
          r(25, 130, 284, 2, C.orange);
          number(total, 56, 89, 6, 'rgba(143,53,21,0.28)');
          number(total, 54, 87, 6, C.black);
          t('VIEWS', 255, 105, 9, C.brown);
          const articleCountLabel = articleCount === '--' ? '--' : String(Number(articleCount));
          t(`SUM OF ALL ${articleCountLabel} ARTICLES VIEWS`, W / 2, 149, 8, C.brown, 'center');

          drawRoamingCritter();

          r(0, H - 13, W, 13, C.orange);
          r(0, H - 13, W, 2, C.black);
          t(`ART ${articleCount} ${source}`, 8, H - 9, 6, C.pale);
          t(`${blink ? '■' : ' '} 1MIN ${updated}`, 232, H - 9, 6, C.pale);
        }
        async function fetchJson(urls) {
          let lastError;
          for (const url of urls) {
            try {
              const res = await fetch(url, { cache: 'no-store' });
              if (!res.ok) throw new Error(`${res.status}`);
              return { data: await res.json(), url };
            } catch (e) {
              lastError = e;
            }
          }
          throw lastError || new Error('fetch failed');
        }
        async function ids() {
          if (cachedIds.length) return cachedIds;
          try {
            const { data } = await fetchJson(DATA_URLS);
            const out = [];
            ['ideas', 'lunches', 'quotes'].forEach((key) => {
              if (Array.isArray(data[key])) data[key].forEach((item) => item && item.id && out.push(String(item.id)));
            });
            cachedIds = [...new Set(out)].filter(Boolean);
          } catch (e) {
            cachedIds = FALLBACK_IDS;
          }
          return cachedIds.length ? cachedIds : FALLBACK_IDS;
        }
        async function update() {
          try {
            note.textContent = 'くるひもタイムズの訪問回数を確認中...';
            source = 'LOADING';
            draw();
            const articleIds = await ids();
            const qs = new URLSearchParams({ ids: articleIds.join(',') }).toString();
            const { data, url } = await fetchJson(API_URLS.map((api) => `${api}?${qs}`));
            total = articleIds.reduce((sum, id) => sum + Number((data.counts && data.counts[id]) || 0), 0);
            articleCount = String(articleIds.length).padStart(2, '0');
            source = new URL(url).host.replace('www.', '').toUpperCase().slice(0, 10);
            updated = new Intl.DateTimeFormat('ja-JP', { hour: '2-digit', minute: '2-digit' }).format(new Date());
            note.textContent = `${articleIds.length}件の記事ビュー合計を表示中`;
            draw();
          } catch (e) {
            source = 'RETRY';
            updated = new Intl.DateTimeFormat('ja-JP', { hour: '2-digit', minute: '2-digit' }).format(new Date());
            note.textContent = '訪問回数を取得できませんでした';
            draw();
          }
        }
        draw();
        update();
        setInterval(() => { blink = !blink; animFrame = (animFrame + 1) % 96; draw(); }, 900);
        setInterval(update, REFRESH_MS);
        document.addEventListener('visibilitychange', () => { if (!document.hidden) update(); });
      })();
    </script>
  </body>
</html>

<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#6b3416" />
    <meta http-equiv="cache-control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="pragma" content="no-cache" />
    <meta http-equiv="expires" content="0" />
    <title>くるひもタイムズ ゲームボーイ風カウンター</title>
    <link rel="stylesheet" href="./styles.css?v=fit-digits-1" />
  </head>
  <body>
    <main class="gameboy-frame" aria-label="iPhone SE 横向き専用のくるひもタイムズ訪問回数カウンター">
      <canvas id="pixel-screen" width="334" height="188" aria-label="くるひもタイムズ記事ビューカウンター"></canvas>
      <p id="counter-note" class="sr-status" aria-live="polite">カウンターを読み込み中...</p>
    </main>

    <script>
      (() => {
        const canvas = document.getElementById('pixel-screen');
        const note = document.getElementById('counter-note');
        const ctx = canvas.getContext('2d');
        const W = 334;
        const H = 188;
        const API_URLS = ['https://kuruhimo.com/api/article-counter', 'https://kuruhitimes.pages.dev/api/article-counter'];
        const DATA_URLS = ['https://kuruhimo.com/data.json', 'https://kuruhitimes.pages.dev/data.json', 'https://raw.githubusercontent.com/Nacchanman/kuruhitimes/main/data.json'];
        const FALLBACK_IDS = ['idea-5', 'idea-4', 'idea-3', 'idea-2', 'idea-1'];
        const REFRESH_MS = 5 * 60 * 1000;
        const C = { black:'#1b1008', brown:'#542713', dark:'#8f3515', orange:'#d85a22', mid:'#ef8b3b', light:'#ffba5c', paper:'#ffe0a0', pale:'#fff0bf', cream:'#fff7d1' };
        const D = {
          '0':['111','101','101','101','101','101','111'], '1':['010','110','010','010','010','010','111'],
          '2':['111','001','001','111','100','100','111'], '3':['111','001','001','111','001','001','111'],
          '4':['101','101','101','111','001','001','001'], '5':['111','100','100','111','001','001','111'],
          '6':['111','100','100','111','101','101','111'], '7':['111','001','001','010','010','010','010'],
          '8':['111','101','101','111','101','101','111'], '9':['111','101','101','111','001','001','111'],
          '-':['000','000','000','111','000','000','000']
        };
        let total = 0;
        let articleCount = '--';
        let source = 'LOADING';
        let updated = '--:--';
        let blink = true;
        let cachedIds = [];
        ctx.imageSmoothingEnabled = false;

        function r(x, y, w, h, color) { ctx.fillStyle = color; ctx.fillRect(Math.round(x), Math.round(y), Math.round(w), Math.round(h)); }
        function t(str, x, y, size, color, align = 'left', font = 'monospace') { ctx.fillStyle = color; ctx.textAlign = align; ctx.textBaseline = 'top'; ctx.font = `${size}px ${font}`; ctx.fillText(str, Math.round(x), Math.round(y)); }
        function digit(ch, x, y, s, color) { (D[ch] || D['-']).forEach((row, yy) => [...row].forEach((v, xx) => { if (v === '1') r(x + xx * s, y + yy * s, s, s, color); })); }
        function number(n, x, y, s, color) { String(Math.max(0, Number(n) || 0)).padStart(6, '0').split('').forEach((ch, i) => digit(ch, x + i * s * 4, y, s, color)); }
        function bird(x, y) { r(x, y + 2, 4, 2, C.brown); r(x + 4, y, 3, 2, C.brown); r(x + 7, y + 2, 4, 2, C.brown); }

        function draw() {
          ctx.clearRect(0, 0, W, H);
          r(0, 0, W, H, C.pale);
          r(0, 0, W, 36, C.mid);
          r(0, 36, W, 5, C.light);
          r(133, 0, 68, 6, C.light);
          r(119, 6, 96, 6, '#ffa84a');
          r(105, 12, 124, 7, C.orange);
          r(96, 19, 142, 8, C.dark);
          r(0, 32, W, 2, C.brown);
          bird(86, 12); bird(248, 9);

          for (let y = 43; y < H; y += 9) r(0, y, W, 1, 'rgba(84,39,19,0.10)');
          for (let x = 0; x < W; x += 9) r(x, 43, 1, H - 43, 'rgba(84,39,19,0.06)');

          r(0, 42, W, 2, C.brown);
          r(0, 62, W, 2, C.brown);
          r(6, 47, 36, 10, C.black);
          t('VOL013', 9, 49, 6, C.pale);
          t('KURUHIMO TIMES', 55, 48, 8, C.brown);
          t('TOTAL VIEWS', 199, 48, 8, C.brown);
          t(updated, 292, 48, 8, C.brown);

          r(13, 72, 308, 84, C.black);
          r(18, 77, 298, 74, C.paper);
          r(22, 82, 290, 64, C.cream);
          r(25, 86, 284, 2, C.orange);
          r(25, 139, 284, 2, C.orange);

          // Digits are 3 columns x 7 rows. Scale 7 gives height 49px, safely inside y=86..139.
          number(total, 55, 91, 7, 'rgba(143,53,21,0.32)');
          number(total, 52, 88, 7, C.black);
          t('VIEWS', 251, 117, 10, C.brown);

          t('くるひもタイムズ', W / 2, 160, 13, C.black, 'center', 'sans-serif');

          r(0, H - 13, W, 13, C.orange);
          r(0, H - 13, W, 2, C.black);
          t(`ART ${articleCount} ${source}`, 8, H - 9, 6, C.pale);
          t(`${blink ? '■' : ' '} 5MIN`, 277, H - 9, 6, C.pale);
        }

        async function fetchJson(urls) {
          let lastError;
          for (const url of urls) {
            try { const res = await fetch(url, { cache: 'no-store' }); if (!res.ok) throw new Error(`${res.status}`); return { data: await res.json(), url }; }
            catch (e) { lastError = e; }
          }
          throw lastError || new Error('fetch failed');
        }
        async function ids() {
          if (cachedIds.length) return cachedIds;
          try {
            const { data } = await fetchJson(DATA_URLS);
            const out = [];
            ['ideas', 'lunches', 'quotes'].forEach((key) => { if (Array.isArray(data[key])) data[key].forEach((item) => item && item.id && out.push(String(item.id))); });
            cachedIds = [...new Set(out)].filter(Boolean);
          } catch (e) { cachedIds = FALLBACK_IDS; }
          return cachedIds.length ? cachedIds : FALLBACK_IDS;
        }
        async function update() {
          try {
            note.textContent = 'くるひもタイムズの訪問回数を確認中...'; source = 'LOADING'; draw();
            const articleIds = await ids();
            const qs = new URLSearchParams({ ids: articleIds.join(',') }).toString();
            const { data, url } = await fetchJson(API_URLS.map((api) => `${api}?${qs}`));
            total = articleIds.reduce((sum, id) => sum + Number((data.counts && data.counts[id]) || 0), 0);
            articleCount = String(articleIds.length).padStart(2, '0');
            source = new URL(url).host.replace('www.', '').toUpperCase().slice(0, 10);
            updated = new Intl.DateTimeFormat('ja-JP', { hour: '2-digit', minute: '2-digit' }).format(new Date());
            note.textContent = `${articleIds.length}件の記事ビュー合計を表示中`;
            draw();
          } catch (e) {
            source = 'RETRY'; updated = new Intl.DateTimeFormat('ja-JP', { hour: '2-digit', minute: '2-digit' }).format(new Date()); note.textContent = '訪問回数を取得できませんでした'; draw();
          }
        }
        draw(); update(); setInterval(() => { blink = !blink; draw(); }, 700); setInterval(update, REFRESH_MS);
        document.addEventListener('visibilitychange', () => { if (!document.hidden) update(); });
      })();
    </script>
  </body>
</html>
